name: simulator

# The four board programs need the course's libpynq library and a PYNQ-Z2,
# so CI only builds and runs the host-side simulator of the decision logic.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sim/sim.c
        run: gcc -Wall -O2 -o sim/sim sim/sim.c -lm

      - name: Run the simulator
        run: |
          ./sim/sim | tee sim-output.txt
          grep -q "finished at t =" sim-output.txt

      - name: Check the README example still reproduces
        run: |
          ./sim/sim 1792644429 > readme-run.txt
          grep -qx "finished at t = 154.000 s." readme-run.txt
